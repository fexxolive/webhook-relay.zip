name: Ping Webhook Health

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: |
          curl -sS -m 10 -o /dev/null -w "status=%{http_code}\n" https://webhook-relay-zip.onrender.com/health

